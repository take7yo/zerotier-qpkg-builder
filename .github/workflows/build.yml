name: Build and Release Zerotier

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 从 tag 提取版本号（去掉 v 前缀）
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"
          
      - name: Build zerotier qpkg
        run: bash build.sh

      - name: Release qpkg
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            output/*.qpkg
            output/*.md5
          # 🆕 自定义 Release 名称
          name: "ZeroTier ${{ env.VERSION }}"
          body: |
            ## ZeroTier ${{ env.VERSION }}
            
            ### 构建信息
            - 版本: ${{ env.VERSION }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            
            ### 文件
            详见下方 Assets
          generate_release_notes: true
