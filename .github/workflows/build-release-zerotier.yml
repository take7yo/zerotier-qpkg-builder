#!/bin/bash

# GitHub Actions 配置文件：ZeroTier QPKG 自动构建和发布
#
# 触发条件：
# 1. 推送 tag 时自动触发（格式：v*.*.*，如 v1.16.4）
# 2. 手动触发（用于测试构建）
#
# 使用方法：
#
# 1. 自动发布（通过 tag 触发）：
#    git tag v1.16.4
#    git push origin v1.16.4
#    结果：自动创建 v1.16.4 release，包含 QPKG 和 MD5 文件
#
# 2. 手动测试（GitHub Actions 页面）：
#    - 进入仓库的 Actions 页面
#    - 选择 "Build and Release Zerotier" workflow
#    - 点击 "Run workflow"
#    - 输入版本号（如 1.16.5，默认 1.16.2）
#    - 运行，结果在 artifacts 中下载
#
# 注意：
# - tag 触发会创建正式的 GitHub Release
# - 手动触发只生成 artifacts，不创建 Release
# - 版本号格式：x.x.x（不要带 v 前缀）

name: Build and Release Zerotier

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'ZeroTier 版本号 (如: 1.16.2)'
        required: true
        default: '1.16.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # 从 tag 提取版本号（去掉 v 前缀）
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Version from tag: ${VERSION}"
          else
            # 从 workflow_dispatch 输入获取版本号
            VERSION="${{ github.event.inputs.version }}"
            echo "Version from workflow dispatch: ${VERSION}"
          fi
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"
          
      - name: Build zerotier qpkg
        run: |
          echo "Building ZeroTier version: ${{ env.VERSION }}"
          # 传递版本号给构建脚本
          bash build.sh "${{ env.VERSION }}"

      - name: Release qpkg
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            output/*.qpkg
            output/*.md5
          name: "ZeroTier ${{ env.VERSION }}"
          body: |
            ## ZeroTier ${{ env.VERSION }}
            
            ### 构建信息
            - 版本: ${{ env.VERSION }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            
            ### 文件
            - `zerotier_${{ env.VERSION }}_x86_64.qpkg`
            - `zerotier_${{ env.VERSION }}_x86_64.qpkg.md5`
            
            ### 安装说明
            ```bash
            # SSH 安装
            qpkg_cli -i zerotier_${{ env.VERSION }}_x86_64.qpkg
            
            # 服务管理
            qpkg_cli -s zerotier start
            qpkg_cli -s zerotier stop
            qpkg_cli -s zerotier restart
            ```
          generate_release_notes: true
      
      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-${{ env.VERSION }}-qpkg
          path: output/
          retention-days: 7
